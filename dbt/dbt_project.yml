name: sn_analytics
version: "1.0.0"
config-version: 2

# Bronze and silver stay exactly as populated today by etl_core/ - dbt only
# reads silver as a source. Gold is being migrated TABLE BY TABLE from the
# Python builders in etl_core/gold/*.py into the models/gold/ dbt models
# below (see docs/dbt_onboarding.md for the migration log and status per
# table). Table/column names are kept identical throughout the migration so
# Superset and the Copilot agent never notice which one built a given table.
profile: "sn_analytics"

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

# Business-config knobs pulled out of buried SQL (previously Python
# constants in etl_core/gold/config.py) - referenced in models via
# {{ var('response_sla_name') }} etc.
vars:
  response_sla_name: "TPA first reaction SLA"
  resolution_sla_name: "TPA case resolution SLA"
  date_dim_start: "2020-01-01"
  date_dim_end: "2030-12-31"

models:
  sn_analytics:
    gold:
      +materialized: table
      +schema: gold
      +tags: ["gold"]
      # +schema here resolves to exactly "gold" (not "dbt_scratch_gold")
      # because of the generate_schema_name override in
      # macros/get_custom_schema.sql - see that file for why.

# seeds/ci_only/*.csv are small, entirely synthetic silver.* fixtures used
# ONLY by the CI "dbt-build-test" GitHub Actions job, which runs against a
# throwaway Postgres service container that starts empty every time. They
# are tagged so a bare `dbt seed` (e.g. run locally against `dev`) does
# NOT touch them - CI explicitly runs `dbt seed --select tag:ci_only`.
# Never run this seed against a real target: it would insert 8 fake cases
# on top of the real ones in silver.sn_customerservice_case. See
# seeds/ci_only/README.md for what each row is there to test.
seeds:
  sn_analytics:
    ci_only:
      +schema: silver
      +tags: ["ci_only"]
