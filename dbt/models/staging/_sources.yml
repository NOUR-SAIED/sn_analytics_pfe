version: 2

sources:
  - name: silver
    description: >
      Existing silver-layer tables, populated by the Python pipeline in
      etl_core/loaders/postgres_silver.py and orchestrated by
      dags/sn_bronze_to_silver.py. dbt only reads these - it does not load
      or own them.
    schema: silver
    tables:
      - name: sn_customerservice_case
        description: >
          One row per ServiceNow case, upserted by sys_id (latest state
          only, no history - see docs/dbt_onboarding.md for why the
          snapshot in snapshots/sn_case_snapshot.sql exists).
      - name: sys_user
        description: ServiceNow user records, used to enrich gold.dim_agent.
      - name: task_sla
        description: >
          Up to 2 rows per case (one per SLA type) - long/narrow, pivoted
          wide in models/gold/fact_case.sql before joining into the fact
          table, same as the original etl_core/gold/fact_case.py did.
      - name: contract_sla
        description: SLA definitions (names, targets) referenced by task_sla.
