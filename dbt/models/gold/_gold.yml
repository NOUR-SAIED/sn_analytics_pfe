version: 2

# Replaces the hard PRIMARY KEY/REFERENCES DDL the old etl_core/gold/config.py
# column lists declared (CREATE TABLE ... PRIMARY KEY, ... REFERENCES ...).
# Plain dbt `table` materialization doesn't emit those - this is the
# replacement: dbt tests, run via `dbt test --select gold`, checked on every
# pipeline run. See docs/dbt_onboarding.md for why this is the design choice
# (not a downgrade - dbt tests are actually the more standard warehouse
# pattern, and they run automatically instead of only existing as static DDL).

models:
  - name: dim_date
    description: One row per calendar day (fixed range - see vars in dbt_project.yml).
    columns:
      - name: date_key
        description: Surrogate key, YYYYMMDD as an integer.
        data_tests:
          - unique
          - not_null
      - name: full_date
        data_tests:
          - unique
          - not_null

  - name: dim_agent
    description: >
      One row per distinct agent sys_id referenced anywhere in the case
      table's 5 agent-role columns (assigned_to, opened_by, resolved_by,
      owned_by, last_assignee), enriched from silver.sys_user.
    columns:
      - name: agent_sys_id
        data_tests:
          - unique
          - not_null

  - name: dim_assignment_group
    description: >
      One row per distinct assignment group referenced in the case table's
      2 group-role columns (assignment_group, last_assignment_group).
    columns:
      - name: assignment_group_sys_id
        data_tests:
          - unique
          - not_null

  - name: dim_terminal
    description: One row per distinct parking terminal referenced in the case table.
    columns:
      - name: terminal_sys_id
        data_tests:
          - unique
          - not_null

  - name: fact_case
    description: >
      One row per ServiceNow case (grain confirmed in the original
      etl_core/gold/fact_case.py). SLA metrics pivoted from silver.task_sla
      before joining to avoid fan-out. The last table migrated off the
      Python gold pipeline - see docs/dbt_onboarding.md.
    columns:
      - name: case_id
        data_tests: [unique, not_null]
      - name: sys_id
        data_tests: [unique, not_null]
      # -- Date role FKs -> dim_date. relationships tests ignore nulls by
      # default, matching the original nullable FK columns' behavior (a
      # case with no opened_at, for example, just has a null date key).
      - name: opened_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: assigned_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: first_response_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: resolved_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: closed_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: occurrence_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      # -- Agent role FKs -> dim_agent
      - name: assigned_to_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_agent'), field: agent_sys_id}}
      - name: opened_by_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_agent'), field: agent_sys_id}}
      - name: resolved_by_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_agent'), field: agent_sys_id}}
      - name: owned_by_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_agent'), field: agent_sys_id}}
      - name: last_assignee_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_agent'), field: agent_sys_id}}
      # -- Assignment group role FKs -> dim_assignment_group
      - name: assignment_group_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_assignment_group'), field: assignment_group_sys_id}}
      - name: last_assignment_group_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_assignment_group'), field: assignment_group_sys_id}}
      # -- Terminal FK -> dim_terminal
      - name: parking_terminal_sys_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_terminal'), field: terminal_sys_id}}

  - name: fact_case_status_history
    description: >
      One row per (case, contiguous period spent in one state_label) - built
      on top of snapshots.sn_case_snapshot (SCD2), NOT on fact_case. Grain is
      case-stage, not case - a case with 4 state changes has 4 rows here.
      Closes the "snapshot not read downstream" gap tracked in CLAUDE.md.
    columns:
      - name: stage_id
        description: dbt_scd_id from the snapshot - already unique per state period, reused as-is rather than inventing a new key.
        data_tests: [unique, not_null]
      - name: case_id
        description: Same sys_id as fact_case.case_id, just at stage grain instead of case grain.
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fact_case'), field: case_id}}
      - name: state_label
        data_tests: [not_null]
      - name: stage_started_at
        data_tests: [not_null]
