version: 2

# Replaces the hard PRIMARY KEY/REFERENCES DDL the old etl_core/gold/config.py
# column lists declared (CREATE TABLE ... PRIMARY KEY, ... REFERENCES ...).
# Plain dbt `table` materialization doesn't emit those - this is the
# replacement: dbt tests, run via `dbt test --select gold`, checked on every
# pipeline run. See docs/dbt_onboarding.md for why this is the design choice
# (not a downgrade - dbt tests are actually the more standard warehouse
# pattern, and they run automatically instead of only existing as static DDL).

models:
  - name: dim_date
    description: One row per calendar day (fixed range - see vars in dbt_project.yml).
    columns:
      - name: date_key
        description: Surrogate key, YYYYMMDD as an integer.
        data_tests:
          - unique
          - not_null
      - name: full_date
        data_tests:
          - unique
          - not_null

  - name: dim_agent
    description: >
      One row per distinct agent sys_id referenced anywhere in the case
      table's 5 agent-role columns (assigned_to, opened_by, resolved_by,
      owned_by, last_assignee), enriched from silver.sys_user.
    columns:
      - name: agent_sys_id
        data_tests:
          - unique
          - not_null

  - name: dim_assignment_group
    description: >
      One row per distinct assignment group referenced in the case table's
      2 group-role columns (assignment_group, last_assignment_group).
    columns:
      - name: assignment_group_sys_id
        data_tests:
          - unique
          - not_null

  - name: dim_terminal
    description: One row per distinct parking terminal referenced in the case table.
    columns:
      - name: terminal_sys_id
        data_tests:
          - unique
          - not_null
