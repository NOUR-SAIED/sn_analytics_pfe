[pytest]
# Only collect the real, assertion-based unit test suite under tests/.
# dags/test_extraction.py and dags/test_e2e_load.py are deliberately
# excluded: they are manual verification scripts that need live
# ServiceNow credentials and a live Postgres connection, not automated
# unit tests - running them in CI would either fail for lack of secrets
# or silently do nothing useful. See CLAUDE.md's CI section for why.
testpaths = tests
