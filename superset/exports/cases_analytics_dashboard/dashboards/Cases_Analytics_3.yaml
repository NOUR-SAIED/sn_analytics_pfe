css: "/* \u2500\u2500 Design tokens \u2500\u2500\n   Desaturated from the first pass\
  \ on purpose: hsl(222 47% ...) read as\n   distinctly \"navy blue\" next to Superset's\
  \ neutral-black native dark theme \u2014\n   two different darks clashing instead\
  \ of one surface. Dropping saturation\n   way down keeps the same cool undertone\
  \ (still ties to the Copilot agent's\n   --primary teal) but reads as neutral charcoal/graphite,\
  \ the way\n   Linear/Vercel/GitHub dark themes do. Teal stays the ONE accent color\
  \ \u2014\n   everything else is flat neutral gray. */\n:root {\n  --bg-main: hsl(222\
  \ 18% 8%);\n  --bg-card: hsl(222 15% 12%);\n  --border-color: hsl(222 12% 22%);\n\
  \  --accent-1: hsl(173 65% 46%);      /* agent --primary (dark) \u2014 teal, used\
  \ sparingly */\n  --text-main: hsl(210 15% 96%);\n  --text-muted: hsl(215 10% 62%);\n\
  \  --text-title: hsl(215 10% 52%);\n  --good: hsl(142 71% 45%);\n  --warning: hsl(38\
  \ 92% 50%);\n  --critical: hsl(0 63% 55%);\n}\n\n/* \u2500\u2500 Main dashboard\
  \ background \u2500\u2500 */\n.dashboard-content {\n  background-color: var(--bg-main)\
  \ !important;\n  font-family: 'Inter', sans-serif;\n}\n\n/* \u2500\u2500 Chart cards:\
  \ flat surface, soft teal halo (not a heavy black drop-shadow\n   like before \u2014\
  \ a glow, restrained). Excludes the Tabs wrapper and Divider,\n   which carry this\
  \ same generic class. \u2500\u2500 */\n.dashboard-component:not(.dashboard-component-tabs):not(.dashboard-component-divider)\
  \ {\n  background: var(--bg-card) !important;\n  border-radius: 10px !important;\n\
  \  border: 1px solid var(--border-color) !important;\n  box-shadow: 0 0 20px -8px\
  \ rgba(45, 212, 191, 0.12) !important;\n  color: var(--text-main);\n}\n\n/* \u2500\
  \u2500 KPI tiles: a touch more presence than regular chart cards, but nowhere\n\
  \   near the old strong halo \u2014 with 5+ tiles sitting in a row, a big glow on\n\
  \   each one reads as noisy/gaudy rather than \"hero.\" Just a slightly brighter\n\
  \   border, no extra blur. \u2500\u2500 */\n.dashboard-component.dashboard-component-chart-holder:has(div[data-test-viz-type=\"\
  big_number\"]),\n.dashboard-component.dashboard-component-chart-holder:has(div[data-test-viz-type=\"\
  big_number_total\"]) {\n  border-color: rgba(45, 212, 191, 0.5) !important;\n  box-shadow:\
  \ 0 0 16px -6px rgba(45, 212, 191, 0.2) !important;\n}\n\n/* \u2500\u2500 Tabs wrapper\
  \ + Divider: sit flat against the page, no card slab \u2500\u2500 */\n.dashboard-component-tabs,\n\
  .dashboard-component-divider {\n  background: transparent !important;\n  box-shadow:\
  \ none !important;\n}\n\n/* \u2500\u2500 Breathing room between the tab strip and\
  \ the first row under it\n   (this is what was reading as \"cards overlapping the\
  \ tab\") \u2500\u2500 */\n.ant-tabs-tabpane .grid-content > .empty-droptarget:first-child,\n\
  .ant-tabs-tabpane > div > .empty-droptarget:first-child {\n  min-height: 0 !important;\n\
  }\n.ant-tabs-content-holder {\n  margin-top: 20px !important;\n}\n\n/* \u2500\u2500\
  \ Chart titles \u2500\u2500 */\n.dashboard-component-chart-holder .editable-title\
  \ a,\n.dashboard-component-chart-holder .editable-title--editable {\n  color: var(--text-title)\
  \ !important;\n  font-size: 11px !important;\n  font-weight: 700 !important;\n \
  \ text-transform: uppercase !important;\n  letter-spacing: 0.08em !important;\n\
  }\n\n/* \u2500\u2500 Big Number tiles \u2014 no forced min-height, so grid resizing\
  \ in Edit mode\n   actually takes effect instead of being fought by CSS \u2500\u2500\
  \ */\n.big_number_total .header-line,\n.big_number .header-line {\n  color: var(--accent-1)\
  \ !important;\n  font-weight: 700 !important;\n}\n\n/* \u2500\u2500 Bar chart labels/axes\
  \ \u2500\u2500 */\ndiv[data-test-viz-type=echarts_timeseries_bar] text { fill: var(--text-muted)\
  \ !important; font-size: 12px !important; }\n\n/* \u2500\u2500 Dashboard title \u2500\
  \u2500 */\n[data-test=\"editable-title\"] { color: var(--text-main) !important;\
  \ }\n\n/* \u2500\u2500 Tabs (Operational Analysis / Service Performance & SLA) \u2500\
  \u2500 */\n.ant-tabs-tab { color: var(--text-muted) !important; font-weight: 600\
  \ !important; }\n.ant-tabs-tab:hover { color: var(--text-main) !important; }\n.ant-tabs-tab-active\
  \ .ant-tabs-tab-btn { color: var(--accent-1) !important; font-weight: 700 !important;\
  \ }\n.ant-tabs-ink-bar { background: var(--accent-1) !important; }\n.ant-tabs-nav::before\
  \ { border-bottom-color: var(--border-color) !important; }\n\n/* \u2500\u2500 Left\
  \ \"Filters and controls\" panel \u2500\u2500 */\n[data-test=\"dashboard-filters-panel\"\
  ] {\n  background: var(--bg-main) !important;\n  border-right: 1px solid var(--border-color)\
  \ !important;\n}\n[data-test=\"filter-bar\"] { background: var(--bg-main) !important;\
  \ color: var(--text-main) !important; }\n[data-test=\"filter-bar\"] input, [data-test=\"\
  filter-bar\"] .ant-select-selector {\n  background: var(--bg-card) !important; border-color:\
  \ var(--border-color) !important; color: var(--text-main) !important;\n}\n\n/* \u2500\
  \u2500 AI Copilot banner (Markdown component). IMPORTANT: Superset's markdown\n\
  \   sanitizer strips ALL attributes except href/src from raw HTML \u2014 every\n\
  \   class=\"\" we tried got silently dropped, only bare nested <div>/<p>/<a>\n \
  \  survive. So this has to be styled purely structurally (child position),\n   matching\
  \ the exact markup Superset renders, not by class. Wrapper class\n   is also `.dashboard-markdown`,\
  \ not `.dashboard-component-markdown`. \u2500\u2500 */\n.dashboard-markdown .dashboard-component-chart-holder\
  \ > div {\n  display: flex; align-items: center; justify-content: space-between;\n\
  \  gap: 20px; flex-wrap: wrap; padding: 4px 8px;\n}\n.dashboard-markdown .dashboard-component-chart-holder\
  \ > div > div:first-child {\n  display: flex; align-items: center; gap: 14px;\n\
  }\n.dashboard-markdown .dashboard-component-chart-holder > div > div:first-child\
  \ > div:first-child {\n  width: 40px; height: 40px; border-radius: 10px; flex-shrink:\
  \ 0;\n  background: hsla(173, 65%, 46%, 0.12); border: 1px solid hsla(173, 65%,\
  \ 46%, 0.3);\n  display: flex; align-items: center; justify-content: center; font-size:\
  \ 18px;\n}\n.dashboard-markdown .dashboard-component-chart-holder > div > div:first-child\
  \ > div:last-child p:first-child {\n  font-size: 11px; font-weight: 700; letter-spacing:\
  \ 0.08em; text-transform: uppercase;\n  color: var(--accent-1); margin: 0 0 3px\
  \ 0;\n}\n.dashboard-markdown .dashboard-component-chart-holder > div > div:first-child\
  \ > div:last-child p:last-child {\n  font-size: 14px; color: var(--text-muted);\
  \ margin: 0; max-width: 480px; line-height: 1.4;\n}\n.dashboard-markdown .dashboard-component-chart-holder\
  \ > div > a {\n  display: inline-flex; align-items: center; gap: 6px; flex-shrink:\
  \ 0;\n  background: var(--accent-1); color: hsl(222 18% 8%) !important;\n  font-weight:\
  \ 700; font-size: 13px; text-decoration: none !important;\n  padding: 9px 18px;\
  \ border-radius: 20px; transition: opacity 0.15s ease;\n}\n.dashboard-markdown .dashboard-component-chart-holder\
  \ > div > a:hover { opacity: 0.85; }\n\n/* \u2500\u2500 Scrollbar \u2500\u2500 */\n\
  ::-webkit-scrollbar { width: 6px; }\n::-webkit-scrollbar-track { background: var(--bg-main);\
  \ }\n::-webkit-scrollbar-thumb { background: var(--border-color); border-radius:\
  \ 3px; }\n"
