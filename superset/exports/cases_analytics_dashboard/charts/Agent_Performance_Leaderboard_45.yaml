slice_name: Agent Performance Leaderboard
description: null
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 19__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - agent_name
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: Cases
    optionName: m_cases
  - expressionType: SQL
    sqlExpression: 100.0*SUM(CASE WHEN response_sla_has_breached=TRUE THEN 1 ELSE
      0 END)/COUNT(*)
    label: Breach %
    optionName: m_breach
  - expressionType: SQL
    sqlExpression: ROUND((PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY resolution_sla_duration)/3600.0)::numeric,1)
    label: Median Resolution (h)
    optionName: m_res
  - expressionType: SQL
    sqlExpression: ROUND((100.0*SUM(CASE WHEN reassignment_count>0 THEN 1 ELSE 0 END)/COUNT(*))::numeric,1)
    label: Reassign %
    optionName: m_reassign
  - expressionType: SQL
    sqlExpression: ROUND((100.0 - (100.0*SUM(CASE WHEN response_sla_has_breached=TRUE
      THEN 1 ELSE 0 END)/COUNT(*)))::numeric,1)
    label: Score
    optionName: m_score
  adhoc_filters:
  - expressionType: SIMPLE
    subject: agent_name
    operator: '!='
    comparator: Unassigned
    clause: WHERE
    isExtra: false
    isNew: true
  - expressionType: SQL
    sqlExpression: COUNT(*) >= 5
    clause: HAVING
    isExtra: false
    isNew: true
  row_limit: 20
  order_desc: true
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: 100.0 - (100.0*SUM(CASE WHEN response_sla_has_breached=TRUE THEN
      1 ELSE 0 END)/COUNT(*))
    label: Score
  show_cell_bars: true
  color_pn: true
  extra_form_data: {}
