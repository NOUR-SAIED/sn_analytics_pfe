sql: "SELECT\r\n    -- =====================\r\n    -- Identifiers\r\n    -- =====================\r\
  \n    fc.case_id,\r\n    fc.case_number,\r\n\r\n    -- =====================\r\n\
  \    -- Time (role-playing)\r\n    -- =====================\r\n    fc.sys_created_on,\r\
  \n\r\n    od.full_date AS opened_date,\r\n    rd.full_date AS resolved_date,\r\n\
  \    cd.full_date AS closed_date,\r\n\r\n    od.year AS opened_year,\r\n    od.month\
  \ AS opened_month,\r\n    od.week AS opened_week,\r\n    od.weekday AS opened_weekday,\r\
  \n\r\n    rd.year AS resolved_year,\r\n    rd.month AS resolved_month,\r\n    rd.week\
  \ AS resolved_week,\r\n\r\n    cd.year AS closed_year,\r\n    cd.month AS closed_month,\r\
  \n\r\n    EXTRACT(HOUR FROM fc.sys_created_on) AS created_hour,\r\n    EXTRACT(DOW\
  \ FROM fc.sys_created_on) AS created_day_of_week,\r\n\r\n    -- =====================\r\
  \n    -- CORE DIMENSIONS (for workload analysis)\r\n    -- =====================\r\
  \n    COALESCE(ag.agent_name, 'Unassigned') AS agent_name,\r\n    ag.agent_sys_id,\r\
  \n\r\n    grp.assignment_group_name,\r\n    grp.assignment_group_sys_id,\r\n\r\n\
  \    t.terminal_name,\r\n    t.terminal_sys_id,\r\n\r\n    fc.state_label,\r\n \
  \   fc.priority_label,\r\n    fc.urgency_label,\r\n    fc.impact_label,\r\n    fc.category_label,\r\
  \n    fc.subcategory_label,\r\n    fc.device_type_label,\r\n    fc.resolution_code_label,\r\
  \n    fc.cause,\r\n\r\n    -- =====================\r\n    -- SLA raw metrics\r\n\
  \    -- =====================\r\n    fc.response_sla_duration,\r\n    fc.resolution_sla_duration,\r\
  \n\r\n    fc.response_sla_has_breached,\r\n    fc.resolution_sla_has_breached,\r\
  \n\r\n    fc.response_sla_percentage,\r\n    fc.resolution_sla_percentage,\r\n\r\
  \n    -- =====================\r\n    -- Operational workload signals\r\n    --\
  \ =====================\r\n    fc.reassignment_count,\r\n    fc.time_worked,\r\n\
  \r\n    -- =====================\r\n    -- IMPORTANT: workload-ready flag\r\n  \
  \  -- =====================\r\n    1 AS case_count\r\n\r\nFROM gold.fact_case fc\r\
  \n\r\nLEFT JOIN gold.dim_date od\r\n    ON fc.opened_date_key = od.date_key\r\n\r\
  \nLEFT JOIN gold.dim_date rd\r\n    ON fc.resolved_date_key = rd.date_key\r\n\r\n\
  LEFT JOIN gold.dim_date cd\r\n    ON fc.closed_date_key = cd.date_key\r\n\r\nLEFT\
  \ JOIN gold.dim_agent ag\r\n    ON fc.assigned_to_sys_id = ag.agent_sys_id\r\n\r\
  \nLEFT JOIN gold.dim_assignment_group grp\r\n    ON fc.assignment_group_sys_id =\
  \ grp.assignment_group_sys_id\r\n\r\nLEFT JOIN gold.dim_terminal t\r\n    ON fc.parking_terminal_sys_id\
  \ = t.terminal_sys_id;"
