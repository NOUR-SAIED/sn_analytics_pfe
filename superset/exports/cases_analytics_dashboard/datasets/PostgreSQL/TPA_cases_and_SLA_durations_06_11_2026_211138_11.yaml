sql: "SELECT\r\n    fc.case_number,\r\n    a.agent_name,\r\n    t.terminal_name,\r\
  \n    fc.device_type_label,\r\n    fc.priority_label,\r\n    fc.cause,\r\n    fc.state_label,\r\
  \n    fc.response_sla_has_breached,\r\n    fc.resolution_sla_has_breached,\r\n \
  \   response_sla_duration,\r\n\r\n    od.full_date AS opened_date,\r\n    rd.full_date\
  \ AS resolved_date\r\n\r\nFROM gold.fact_case fc\r\n\r\nLEFT JOIN gold.dim_agent\
  \ a\r\n    ON fc.assigned_to_sys_id = a.agent_sys_id\r\n\r\nLEFT JOIN gold.dim_terminal\
  \ t\r\n    ON fc.parking_terminal_sys_id = t.terminal_sys_id\r\n\r\nLEFT JOIN gold.dim_date\
  \ od\r\n    ON fc.opened_date_key = od.date_key\r\n\r\nLEFT JOIN gold.dim_date rd\r\
  \n    ON fc.resolved_date_key = rd.date_key\r\n\r\nLIMIT 100;"
